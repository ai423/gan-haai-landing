# Render קורא את הקובץ הזה משורש הריפו.
# יצירה: Render Dashboard → New → Blueprint → בחירת הריפו הזה.
services:
  - type: web
    name: aman-opportunity-system
    runtime: node
    plan: starter                      # נדרש כדי לצרף נפח קבוע
    region: frankfurt                  # הקרוב ביותר לישראל
    rootDir: aman-opportunity-system
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: aman-data
      mountPath: /var/data             # בסיס הנתונים שורד פריסות מחדש
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: AMAN_DB_PATH
        value: /var/data/aman.db
      - key: TZ
        value: Asia/Jerusalem
      - key: RESEARCH_CRON
        value: 0 3 1 * *               # ה-1 בכל חודש, 03:00
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: APP_USER
        value: aman
      # שני אלה מוזנים ידנית בדשבורד — לא נשמרים בקוד
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
